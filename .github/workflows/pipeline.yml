name: pipeline
on: [ push ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Wiz sensor
        uses: Consensys/github-actions/wiz-sensor@c529b19afef5a8e2ff6993638a99a905de633ddb
        with:
          enabled: ${{ vars.WIZ_SENSOR_ENABLED }}
          token: ${{ secrets.WIZ_SENSOR_TOKEN }}
      - name: 'Clone Repository'
        uses: actions/checkout@v3
      - name: 'Install Node'
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'yarn'
      - name: 'Install Yarn'
        run: npm install -g yarn
      - name: Install Dependencies
        run: yarn
      - name: Build
        run: yarn run build:all
      - name: Unit Tests
        run: yarn run test:all
      - name: Lint
        run: yarn run lint:all
